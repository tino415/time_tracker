name = "track-sync"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Created with:
#   wrangler d1 create track-sync
#   wrangler d1 execute track-sync --remote --file=schema.sql
# then paste the returned id here.
[[d1_databases]]
binding = "DB"
database_name = "track-sync"
database_id = "3e3eb1d0-0d90-4891-b82e-95e9d2adeb13"

# There is no server-side secret, so there is nothing to set here and nothing to
# `wrangler secret put`. A sync token is an *account*, not a shared credential:
# it is generated in the app, carried to another device by QR, and presented on
# every request, which the Worker only ever compares as a SHA-256 against
# accounts.token_hash. It never reads the token from its own environment.
#
# The token is still the whole security boundary — it just lives in the client
# and in that table. Anyone may claim an unused one (POST /account); an account
# is worth nothing without its token.

# The PWA is served by this same Worker, so the app and the API share an origin.
# That is not just tidiness: a separately-hosted app would be cross-origin,
# every sync would need a CORS preflight, and the Worker would have to grow
# origin handling it does not otherwise need. One origin, no preflight, and the
# same shape as the local nginx setup.
#
# Build the bundle first (`just web`), since this uploads whatever is there.
# Headers — including the cross-origin isolation the app wants — come from
# web/_headers, which flutter copies into the build.
#
# not_found_handling is left at its default: an unmatched path falls through to
# the Worker, which is what routes /sync and /export.csv. Turning on the
# single-page-application fallback would answer those with index.html instead.
[assets]
directory = "../build/web"
binding = "ASSETS"
