name: time_tracker
description: "Offline-first time-activity tracker (phone + Wear OS + web PWA)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local persistence (offline-first on every platform, incl. web via wasm/OPFS).
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # State + routing + ids.
  flutter_riverpod: ^2.6.1
  go_router: ^17.2.3
  uuid: ^4.5.1
  share_plus: ^13.3.0

  # Deferred to later phases (kept out of the scaffold on purpose):
  #   wear_plus            — Wear OS shape/ambient (watch phase)
  #   firebase_* / cloud_* — only if a sync backend is chosen (sync phase)

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  sqlite3: ^3.5.0

flutter:
  uses-material-design: true

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 800
