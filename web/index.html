<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the `--base-href` argument to `flutter build`. Must start and
    end with a slash when serving from a sub-path.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline-first time-activity tracker. Hierarchical activities, one-tap switching, an editable calendar, per-category reports and CSV export — stored locally, works without a network.">

  <!--
    Matches NeoTokens.light.brand / .bg, so the browser chrome and the first
    paint agree with the app instead of flashing Flutter's default blue.
  -->
  <meta name="theme-color" content="#2E5D3A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="track">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>track</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The shell behind the canvas, so a slow first paint shows the app's own
       background rather than white. Mirrors NeoTokens light/dark bg. */
    html, body { margin: 0; padding: 0; height: 100%; background: #E7E8EA; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #000000; }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
